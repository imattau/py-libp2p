syntax = "proto3";

package circuit.pb.v2;

// Circuit v2 message types
message HopMessage {
  enum Type {
    RESERVE = 0;
    CONNECT = 1;
    STATUS = 2;
  }

  Type type = 1;
  Peer peer = 2;
  Reservation reservation = 3;
  Limit limit = 4;
  Status status = 5;
}

message StopMessage {
  enum Type {
    CONNECT = 0;
    STATUS = 1;
  }

  Type type = 1;
  Peer peer = 2;
  Limit limit = 3;
  Status status = 4;
}

message Peer {
  bytes id = 1;
  repeated bytes addrs = 2;
}

message Reservation {
  uint64 expire = 1;
  repeated bytes addrs = 2;
  bytes voucher = 3;
  bytes signature = 4; // Legacy field retained for local compatibility.
}

message Limit {
  int64 duration = 1;
  int64 data = 2;
}

message Status {
  enum Code {
    UNUSED = 0;
    OK = 100;
    RESERVATION_REFUSED = 200;
    RESOURCE_LIMIT_EXCEEDED = 201;
    PERMISSION_DENIED = 202;
    CONNECTION_FAILED = 203;
    NO_RESERVATION = 204;
    MALFORMED_MESSAGE = 400;
    UNEXPECTED_MESSAGE = 401;
  }
  Code code = 1;
  string message = 2;
}
